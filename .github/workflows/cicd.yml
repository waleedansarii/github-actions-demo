name: CICD
on:
  workflow_dispatch: 

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Code Clone
        run: echo "Cloning the code"
  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Code Build
        run: echo "Building the code"
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Code Test
        run: echo "Testing the code"
  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Code Deployment
        run: echo "Deploying the code"
